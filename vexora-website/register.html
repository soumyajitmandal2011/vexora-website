<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080710"><title>Create account — VEXORA</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 5%,#28184c 0,transparent 45%),#080710;color:#f7f4ff;font:15px Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(100%,430px);padding:38px;border:1px solid #ffffff20;border-radius:24px;background:#100e1bcc;box-shadow:0 24px 100px #0008;backdrop-filter:blur(16px)}a{color:#c6a8ff}.brand{font-weight:800;letter-spacing:.18em;text-decoration:none;color:white}.eyebrow{color:#b8a2ed;font-size:11px;letter-spacing:.22em;margin-top:36px}h1{font-size:36px;letter-spacing:-.04em;margin:10px 0}p{color:#aaa5ba;line-height:1.6}.field{display:block;margin:16px 0 0;color:#d8d3e5;font-size:13px}.field input{display:block;width:100%;margin-top:8px;background:#090811;border:1px solid #ffffff25;border-radius:11px;padding:14px;color:white;font:inherit;outline:none}.field input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #8b5cf633}button{width:100%;border:0;border-radius:11px;padding:15px;margin-top:22px;background:linear-gradient(100deg,#8b5cf6,#c084fc);color:#10091d;font-weight:800;font-size:14px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{min-height:24px;font-size:13px;color:#c6a8ff;margin-top:14px;overflow-wrap:anywhere}.bottom{text-align:center;margin-top:24px;font-size:13px}.back{display:inline-block;margin-top:22px;text-decoration:none;font-size:13px;color:#aaa5ba}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><main class="card"><a class="brand" href="index.html">VEXORA®</a><div class="eyebrow">START SOMETHING GREAT</div><h1>Create your account.</h1><p>Join VEXORA. Your account details are securely handled by Supabase Auth.</p><form id="auth-form"><label class="field">Your name<input id="name" type="text" autocomplete="name" maxlength="80" required placeholder="Full name"></label><label class="field">Email address<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label class="field">Password<input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></label><label class="field">Confirm password<input id="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat password"></label><button id="submit" type="submit">CREATE ACCOUNT ↗</button><div id="message" class="message" role="status" aria-live="polite"></div></form><div class="bottom">Already have an account? <a href="login.html">Log in</a></div><a class="back" href="index.html">← Back to website</a></main><script>
const client=window.supabase.createClient(window.VEXORA_SUPABASE_URL,window.VEXORA_SUPABASE_KEY);const form=document.getElementById('auth-form'),btn=document.getElementById('submit'),msg=document.getElementById('message');form.addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm){msg.textContent='Your passwords do not match.';return}btn.disabled=true;msg.textContent='Creating your account…';const {data,error}=await client.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:location.origin+'/login.html'}});btn.disabled=false;if(error){msg.textContent=error.message;return}if(data.session){msg.textContent='Account created! Redirecting to your dashboard…';location.href='dashboard.html'}else{msg.textContent='Account created. Check your email for a confirmation link, then log in.';form.reset()}});
</script></body></html>
