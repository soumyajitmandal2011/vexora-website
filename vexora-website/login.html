<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080710"><title>Log in — VEXORA</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#28184c 0,transparent 45%),#080710;color:#f7f4ff;font:15px Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(100%,430px);padding:38px;border:1px solid #ffffff20;border-radius:24px;background:#100e1bcc;box-shadow:0 24px 100px #0008;backdrop-filter:blur(16px)}a{color:#c6a8ff}.brand{font-weight:800;letter-spacing:.18em;text-decoration:none;color:white}.eyebrow{color:#b8a2ed;font-size:11px;letter-spacing:.22em;margin-top:36px}h1{font-size:36px;letter-spacing:-.04em;margin:10px 0}p{color:#aaa5ba;line-height:1.6}.field{display:block;margin:18px 0 0;color:#d8d3e5;font-size:13px}.field input{display:block;width:100%;margin-top:8px;background:#090811;border:1px solid #ffffff25;border-radius:11px;padding:14px;color:white;font:inherit;outline:none}.field input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #8b5cf633}button{width:100%;border:0;border-radius:11px;padding:15px;margin-top:22px;background:linear-gradient(100deg,#8b5cf6,#c084fc);color:#10091d;font-weight:800;font-size:14px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{min-height:24px;font-size:13px;color:#c6a8ff;margin-top:14px;overflow-wrap:anywhere}.bottom{text-align:center;margin-top:24px;font-size:13px}.back{display:inline-block;margin-top:22px;text-decoration:none;font-size:13px;color:#aaa5ba}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><main class="card"><a class="brand" href="index.html">VEXORA®</a><div class="eyebrow">YOUR DIGITAL SPACE</div><h1>Welcome back.</h1><p>Log in to continue to your VEXORA account.</p><form id="auth-form"><label class="field">Email address<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters"></label><button id="submit" type="submit">LOG IN ↗</button><div id="message" class="message" role="status" aria-live="polite"></div></form><div class="bottom">New to VEXORA? <a href="register.html">Create an account</a></div><a class="back" href="index.html">← Back to website</a></main><script>
const client=window.supabase.createClient(window.VEXORA_SUPABASE_URL,window.VEXORA_SUPABASE_KEY);const form=document.getElementById('auth-form'),btn=document.getElementById('submit'),msg=document.getElementById('message');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Signing you in…';const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});btn.disabled=false;if(error){msg.textContent=error.message;return}msg.textContent='Logged in successfully. Redirecting…';location.href='dashboard.html'});
(async()=>{const {data}=await client.auth.getSession();if(data.session)msg.textContent='You are already signed in.'})();
</script></body></html>
