<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your VEXORA account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 15% 10%,#28184c 0,transparent 45%),#080710;color:#f7f4ff;font:16px system-ui;padding:24px}.card{width:min(100%,560px);padding:40px;border:1px solid #ffffff20;border-radius:24px;background:#100e1bcc}a{color:#c6a8ff}button{padding:12px 18px;border:0;border-radius:10px;background:#b99aff;color:#130a24;font-weight:800;cursor:pointer;margin-top:16px}.muted{color:#aaa5ba}</style></head><body><main class="card"><a href="index.html">← VEXORA</a><h1>Your account</h1><p id="status" class="muted">Checking your session…</p><p id="email"></p><button id="logout" hidden>LOG OUT</button></main><script>const client=window.supabase.createClient(window.VEXORA_SUPABASE_URL,window.VEXORA_SUPABASE_KEY);(async()=>{const {data,error}=await client.auth.getUser();if(error||!data.user){location.replace('login.html');return}document.getElementById('status').textContent='You are securely signed in.';document.getElementById('email').textContent=data.user.email||'';document.getElementById('logout').hidden=false})();document.getElementById('logout').addEventListener('click',async()=>{await client.auth.signOut();location.replace('login.html')});</script></body></html>
